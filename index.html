<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация</title>
    <!-- Подключаем современный шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Цветовая палитра Dark Theme */
            --bg-body: #0a0a0a;
            --bg-card: #141414;
            --bg-item: #1e1e1e;
            --bg-item-hover: rgba(94, 92, 230, 0.12); /* Фиолетовый фон при наведении */
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #7c5cff; /* Яркий фиолетовый акцент */
            --accent-glow: rgba(124, 92, 255, 0.4);
            --accent-border: rgba(124, 92, 255, 0.5);
            --border: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            /* Легкий градиентный фон для глубины */
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, var(--bg-body) 50%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.6s ease-out;
        }

        /* Шапка с навигацией */
        header {
            text-align: center;
            margin-bottom: 24px;
        }

        /* Обновленный бейдж "Навигация" - постоянно светится фиолетовым */
        .nav-title {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent); /* Фиолетовый текст */
            padding: 8px 18px;
            background: rgba(124, 92, 255, 0.1); /* Фиолетовый прозрачный фон */
            border-radius: 20px;
            border: 1px solid var(--accent-border); /* Фиолетовая рамка */
            /* Постоянное неоновое свечение */
            box-shadow: 0 0 15px rgba(124, 92, 255, 0.2), 
                        inset 0 0 10px rgba(124, 92, 255, 0.1);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Карточка со списком */
        .card {
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                        0 0 0 1px var(--border);
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Элемент списка (ссылка) */
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background-color: var(--bg-item);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        /* Эффект наведения с фиолетовой подсветкой */
        .file-item:hover {
            background-color: var(--bg-item-hover);
            transform: translateY(-2px);
            border-color: var(--accent-border);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 
                        0 0 20px var(--accent-glow);
        }

        /* Иконка стрелочки, появляющаяся при наведении */
        .file-item::after {
            content: '→';
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            color: var(--accent);
            font-weight: bold;
        }

        .file-item:hover::after {
            opacity: 1;
            transform: translateX(0);
        }

        /* Текст ссылки */
        .file-name {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Кастомная иконка файла */
        .file-icon {
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .file-item:hover .file-icon {
            color: var(--accent);
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Задержка появления для каждого элемента (каскадная анимация) */
        .file-item:nth-child(1) { animation: fadeIn 0.4s ease-out 0.1s both; }
        .file-item:nth-child(2) { animation: fadeIn 0.4s ease-out 0.15s both; }
        .file-item:nth-child(3) { animation: fadeIn 0.4s ease-out 0.2s both; }
        .file-item:nth-child(4) { animation: fadeIn 0.4s ease-out 0.25s both; }
        .file-item:nth-child(5) { animation: fadeIn 0.4s ease-out 0.3s both; }
        .file-item:nth-child(6) { animation: fadeIn 0.4s ease-out 0.35s both; }
    </style>
</head>
<body>

                        Cursor

        </main>

</body>
