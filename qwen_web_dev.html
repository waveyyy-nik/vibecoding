<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyLearn — Полный курс Python</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a23;
  --bg-2:#1b1b32;
  --bg-3:#2a2a40;
  --accent:#f1be32;
  --accent-2:#dfd0b8;
  --text:#ffffff;
  --text-dim:#d0d0d5;
  --success:#3cb371;
  --error:#ff6b6b;
  --border:#3b3b4f;
  --code-bg:#1a1a2e;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.6;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#555}

/* HEADER */
header{
  height:56px;
  background:var(--bg-2);
  border-bottom:2px solid var(--accent);
  display:flex;
  align-items:center;
  padding:0 20px;
  position:relative;
  z-index:100;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  font-size:20px;
  color:var(--accent);
  cursor:pointer;
}
.logo-icon{
  width:36px;height:36px;
  background:var(--accent);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--bg);
  font-weight:900;
  font-size:20px;
}
.nav{
  display:flex;
  gap:8px;
  margin-left:auto;
}
.nav button{
  background:transparent;
  color:var(--text-dim);
  border:none;
  padding:8px 14px;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  transition:all .2s;
}
.nav button:hover{background:var(--bg-3);color:var(--accent)}
.nav button.active{color:var(--accent)}
.menu-toggle{display:none;background:none;border:none;color:var(--accent);font-size:24px;cursor:pointer;margin-right:10px}

/* LAYOUT */
.app{
  display:flex;
  height:calc(100vh - 56px);
}
.sidebar{
  width:280px;
  background:var(--bg-2);
  border-right:1px solid var(--border);
  overflow-y:auto;
  flex-shrink:0;
  transition:transform .3s;
}
.sidebar-header{
  padding:20px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:var(--bg-2);
  z-index:10;
}
.sidebar-header h2{
  font-size:16px;
  color:var(--accent);
  margin-bottom:4px;
}
.sidebar-header p{
  font-size:12px;
  color:var(--text-dim);
}
.progress-bar{
  height:6px;
  background:var(--bg-3);
  border-radius:3px;
  margin-top:10px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--success));
  transition:width .4s;
}
.lesson-list{padding:10px 0}
.module-group{margin-bottom:8px}
.module-title{
  padding:10px 20px;
  font-size:12px;
  text-transform:uppercase;
  color:var(--text-dim);
  letter-spacing:1px;
  font-weight:700;
}
.lesson-item{
  padding:10px 20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
  border-left:3px solid transparent;
  transition:all .15s;
}
.lesson-item:hover{background:var(--bg-3)}
.lesson-item.active{
  background:var(--bg-3);
  border-left-color:var(--accent);
  color:var(--accent);
}
.lesson-item.completed .check{color:var(--success)}
.check{
  width:18px;height:18px;
  border:2px solid var(--border);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  flex-shrink:0;
}
.lesson-item.completed .check{
  background:var(--success);
  border-color:var(--success);
  color:white;
}

/* MAIN */
.main{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}
.content{
  max-width:900px;
  margin:0 auto;
  padding:40px 40px 80px;
  width:100%;
}
.lesson-header{
  margin-bottom:30px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
}
.lesson-tag{
  display:inline-block;
  padding:4px 12px;
  background:var(--bg-3);
  color:var(--accent);
  border-radius:4px;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:12px;
}
.lesson-header h1{
  font-size:32px;
  margin-bottom:8px;
  line-height:1.2;
}
.lesson-meta{
  color:var(--text-dim);
  font-size:13px;
}
.lesson-body h2{
  font-size:22px;
  margin:28px 0 14px;
  color:var(--accent);
}
.lesson-body h3{
  font-size:18px;
  margin:20px 0 10px;
}
.lesson-body p{
  margin-bottom:14px;
  color:var(--text-dim);
}
.lesson-body ul,.lesson-body ol{
  margin:10px 0 14px 24px;
  color:var(--text-dim);
}
.lesson-body li{margin-bottom:6px}
.lesson-body code:not([class*="language-"]){
  background:var(--code-bg);
  padding:2px 7px;
  border-radius:4px;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  color:var(--accent-2);
  border:1px solid var(--border);
}
.lesson-body pre{
  background:var(--code-bg);
  padding:16px;
  border-radius:8px;
  margin:14px 0;
  border:1px solid var(--border);
  overflow-x:auto;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
}
.lesson-body pre code{
  background:none;
  padding:0;
  border:none;
  color:var(--text);
}
.info-box{
  background:rgba(241,190,50,.08);
  border-left:4px solid var(--accent);
  padding:14px 18px;
  margin:16px 0;
  border-radius:0 6px 6px 0;
}
.info-box strong{color:var(--accent)}

/* EDITOR */
.editor-section{
  margin:30px 0;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}
.editor-tabs{
  display:flex;
  background:var(--bg-3);
  border-bottom:1px solid var(--border);
  padding:0 10px;
}
.editor-tab{
  padding:10px 16px;
  font-size:13px;
  color:var(--text-dim);
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.editor-tab.active{
  color:var(--accent);
  border-bottom-color:var(--accent);
}
.editor-wrap{position:relative}
.editor{
  width:100%;
  min-height:220px;
  background:#0d0d1f;
  color:#e0e0e0;
  border:none;
  padding:16px 16px 16px 50px;
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  line-height:1.6;
  resize:vertical;
  outline:none;
  tab-size:4;
}
.line-numbers{
  position:absolute;
  left:0;top:0;bottom:0;
  width:40px;
  background:#0a0a1a;
  padding:16px 8px 16px 0;
  text-align:right;
  color:#555;
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  line-height:1.6;
  pointer-events:none;
  user-select:none;
  overflow:hidden;
}
.editor-actions{
  display:flex;
  gap:10px;
  padding:12px;
  background:var(--bg-3);
  border-top:1px solid var(--border);
  flex-wrap:wrap;
  align-items:center;
}
.btn{
  padding:10px 20px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  transition:all .2s;
  font-family:inherit;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn-primary{
  background:var(--accent);
  color:var(--bg);
}
.btn-primary:hover{background:#e0a820;transform:translateY(-1px)}
.btn-secondary{
  background:var(--bg-3);
  color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{background:var(--border)}
.btn-success{
  background:var(--success);
  color:white;
}
.btn-success:hover{background:#2e9a5f}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status-msg{
  margin-left:auto;
  font-size:13px;
  color:var(--text-dim);
}

/* CONSOLE */
.console{
  background:#050510;
  border-top:1px solid var(--border);
  padding:14px 16px;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  min-height:80px;
  max-height:240px;
  overflow-y:auto;
  white-space:pre-wrap;
  word-break:break-word;
}
.console:empty::before{
  content:"// Вывод появится здесь после запуска кода";
  color:#555;
}
.console .out{color:#c0c0c0}
.console .err{color:var(--error)}
.console .info{color:var(--accent)}

/* TESTS */
.tests-section{
  margin:30px 0;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}
.tests-header{
  padding:14px 18px;
  background:var(--bg-3);
  border-bottom:1px solid var(--border);
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
}
.test-item{
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:flex-start;
  gap:12px;
  font-size:14px;
}
.test-item:last-child{border-bottom:none}
.test-icon{
  width:22px;height:22px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-size:12px;
  background:var(--bg-3);
  color:var(--text-dim);
}
.test-item.pass .test-icon{background:var(--success);color:white}
.test-item.fail .test-icon{background:var(--error);color:white}
.test-item.pass{color:var(--success)}
.test-item.fail{color:var(--error)}

/* NAV BUTTONS */
.lesson-nav{
  display:flex;
  justify-content:space-between;
  margin-top:40px;
  padding-top:20px;
  border-top:1px solid var(--border);
  gap:12px;
}

/* HOME */
.home{
  padding:40px;
  max-width:1200px;
  margin:0 auto;
  overflow-y:auto;
  height:100%;
}
.hero{
  text-align:center;
  padding:60px 20px;
  background:linear-gradient(135deg,var(--bg-2),var(--bg-3));
  border-radius:16px;
  margin-bottom:40px;
  border:1px solid var(--border);
}
.hero h1{
  font-size:48px;
  margin-bottom:16px;
  background:linear-gradient(90deg,var(--accent),#ff9f43);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero p{
  font-size:18px;
  color:var(--text-dim);
  max-width:600px;
  margin:0 auto 24px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
  margin-bottom:40px;
}
.stat-card{
  background:var(--bg-2);
  border:1px solid var(--border);
  padding:24px;
  border-radius:12px;
  text-align:center;
}
.stat-num{
  font-size:36px;
  font-weight:700;
  color:var(--accent);
  margin-bottom:4px;
}
.stat-label{color:var(--text-dim);font-size:14px}
.modules-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}
.module-card{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:24px;
  cursor:pointer;
  transition:all .2s;
}
.module-card:hover{
  transform:translateY(-4px);
  border-color:var(--accent);
  box-shadow:0 10px 30px rgba(241,190,50,.1);
}
.module-card h3{
  margin-bottom:8px;
  color:var(--accent);
}
.module-card p{
  color:var(--text-dim);
  font-size:14px;
  margin-bottom:14px;
}
.module-progress{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  color:var(--text-dim);
}
.module-progress .progress-bar{flex:1}

/* CERTIFICATE MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px;
}
.modal.show{display:flex}
.modal-content{
  background:var(--bg-2);
  border:2px solid var(--accent);
  border-radius:16px;
  padding:40px;
  max-width:600px;
  width:100%;
  text-align:center;
  position:relative;
}
.modal-close{
  position:absolute;
  top:14px;right:14px;
  background:none;border:none;
  color:var(--text-dim);
  font-size:24px;
  cursor:pointer;
}
.cert{
  background:linear-gradient(135deg,#1a1a3e,#0a0a23);
  border:3px double var(--accent);
  padding:40px 30px;
  border-radius:12px;
  margin:20px 0;
}
.cert h2{
  color:var(--accent);
  font-size:28px;
  margin-bottom:10px;
}
.cert .cert-title{
  font-size:18px;
  color:var(--text-dim);
  margin-bottom:20px;
}
.cert .cert-name{
  font-size:24px;
  color:var(--text);
  margin:20px 0;
  padding:10px;
  border-bottom:1px solid var(--border);
}
.cert .cert-date{
  color:var(--text-dim);
  font-size:13px;
  margin-top:20px;
}

/* LOADING */
.loading{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:20px;
  z-index:2000;
}
.spinner{
  width:60px;height:60px;
  border:4px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text-dim)}

/* RESPONSIVE */
@media (max-width:768px){
  .menu-toggle{display:block}
  .sidebar{
    position:fixed;
    top:56px;left:0;bottom:0;
    z-index:50;
    transform:translateX(-100%);
  }
  .sidebar.open{transform:translateX(0)}
  .content{padding:20px}
  .hero h1{font-size:32px}
  .lesson-header h1{font-size:24px}
  .nav button{padding:6px 10px;font-size:12px}
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Загружаем Python-интерпретатор...</div>
  <div class="loading-text" id="loadStatus" style="font-size:12px;opacity:.6">Инициализация Pyodide</div>
</div>

<header>
  <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
  <div class="logo" onclick="showHome()">
    <div class="logo-icon">Py</div>
    <span>PyLearn</span>
  </div>
  <nav class="nav">
    <button onclick="showHome()" id="nav-home" class="active">Курсы</button>
    <button onclick="showAbout()">О проекте</button>
    <button onclick="resetProgress()">Сбросить прогресс</button>
  </nav>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 id="sidebarTitle">Программа курса</h2>
      <p id="sidebarSubtitle">Полный курс Python</p>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <p id="progressText" style="margin-top:6px;font-size:11px">Пройдено: 0 / 0</p>
    </div>
    <div class="lesson-list" id="lessonList"></div>
  </aside>

  <main class="main" id="main">
    <!-- home / lesson content injected here -->
  </main>
</div>

<div class="modal" id="certModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeCert()">×</button>
    <h2 style="color:var(--accent)">🎉 Поздравляем!</h2>
    <p style="color:var(--text-dim);margin:10px 0">Вы успешно завершили курс Python!</p>
    <div class="cert">
      <h2>СЕРТИФИКАТ</h2>
      <div class="cert-title">о прохождении курса</div>
      <div style="font-size:14px;color:var(--text-dim);margin-top:10px">«Полный курс Python»</div>
      <div class="cert-name" id="certName">Имя студента</div>
      <div style="color:var(--text-dim);font-size:13px">успешно завершил(а) курс PyLearn</div>
      <div class="cert-date" id="certDate"></div>
    </div>
    <button class="btn btn-primary" onclick="closeCert()">Закрыть</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

<script>
// ================= ДАННЫЕ КУРСА =================
const COURSE = {
  modules: [
    {
      title: "Основы Python",
      lessons: [
        {
          id:"intro",
          title:"Введение в Python",
          tag:"Урок 1",
          time:"10 мин",
          theory:`
<h2>Что такое Python?</h2>
<p>Python — это высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом в 1991 году. Он известен своим чистым синтаксисом и читаемым кодом.</p>
<h2>Почему Python?</h2>
<ul>
  <li><strong>Простой синтаксис</strong> — код читается почти как английский текст</li>
  <li><strong>Огромное сообщество</strong> — миллионы разработчиков по всему миру</li>
  <li><strong>Универсальность</strong> — веб, наука, AI, автоматизация, игры</li>
  <li><strong>Богатая стандартная библиотека</strong> — «батарейки в комплекте»</li>
</ul>
<h2>Ваша первая программа</h2>
<p>Традиционно изучение любого языка начинают с программы <code>Hello, World!</code>. В Python это делается одной строкой:</p>
<pre><code class="language-python">print("Hello, World!")</code></pre>
<div class="info-box"><strong>💡 Совет:</strong> Попробуйте изменить текст в кавычках и запустить код — увидите результат в консоли ниже.</div>
`,
          code:`# Ваша первая программа на Python
print("Hello, World!")
print("Добро пожаловать в PyLearn!")`,
          tests:[
            {text:'Код выводит строку "Hello, World!"', check:(out)=>out.includes("Hello, World!")},
            {text:'Код выводит приветствие PyLearn', check:(out)=>out.includes("PyLearn")}
          ]
        },
        {
          id:"variables",
          title:"Переменные и типы данных",
          tag:"Урок 2",
          time:"15 мин",
          theory:`
<h2>Переменные</h2>
<p>Переменная — это именованная ячейка памяти для хранения данных. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
<pre><code class="language-python">name = "Алиса"
age = 25
height = 1.68
is_student = True</code></pre>
<h2>Основные типы данных</h2>
<ul>
  <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
  <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
  <li><code>str</code> — строки: <code>"Привет"</code>, <code>'Python'</code></li>
  <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
  <li><code>NoneType</code> — отсутствие значения: <code>None</code></li>
</ul>
<h2>Функция type()</h2>
<p>Узнать тип переменной можно с помощью <code>type()</code>:</p>
<pre><code class="language-python">x = 10
print(type(x))  # &lt;class 'int'&gt;

y = "hello"

from math import gcd

class Fraction:
    def __init__(self, num, den=1):
        if den == 0:
            raise ValueError("Знаменатель не может быть 0")
        g = gcd(abs(num), abs(den))
        self.num = num // g
        self.den = den // g
        if self.den < 0:
            self.num = -self.num
            self.den = -self.den
    
    def __add__(self, other):
        return Fraction(self.num * other.den + other.num * self.den,
                       self.den * other.den)
    
    def __sub__(self, other):
        return Fraction(self.num * other.den - other.num * self.den,
                       self.den * other.den)
    
    def __mul__(self, other):
        return Fraction(self.num * other.num, self.den * other.den)
    
    def __str__(self):
        if self.den == 1:
            return str(self.num)
        return f"{self.num}/{self.den}"
    
    def __repr__(self):
        return f"Fraction({self.num}, {self.den})"

def cache(func):

class TodoManager:
    def __init__(self):
        self.tasks = []
        self.next_id = 1
    
    def add(self, title):
        task = {"id": self.next_id, "title": title, "done": False}
        self.tasks.append(task)
        self.next_id += 1
        return task
    
    def complete(self, task_id):
        for task in self.tasks:
            if task["id"] == task_id:
                task["done"] = True
                return True
        return False
    
    def delete(self, task_id):
        self.tasks = [t for t in self.tasks if t["id"] != task_id]
    
    def show(self):
        if not self.tasks:
            print("(список пуст)")
            return
        for task in self.tasks:
            status = "✓" if task["done"] else "○"
            print(f"[{task['id']}] {status} {task['title']}")
    
    def stats(self):
        total = len(self.tasks)
        done = sum(1 for t in self.tasks if t["done"])
        return total, done
    
    def to_json(self):
        return json.dumps(self.tasks, ensure_ascii=False, indent=2)

import operator
import math

# Безопасный калькулятор на основе AST
class Calculator:
    OPERATORS = {
        ast.Add: operator.add,
        ast.Sub: operator.sub,
        ast.Mult: operator.mul,
        ast.Div: operator.truediv,
        ast.Pow: operator.pow,
        ast.USub: operator.neg,
        ast.UAdd: operator.pos,
    }
    FUNCTIONS = {
        'sqrt': math.sqrt,
        'sin': math.sin,
        'cos': math.cos,
        'abs': abs,
    }
    
    def __init__(self):
        self.history = []
        self.variables = {'pi': math.pi, 'e': math.e}
    
    def eval_node(self, node):
        if isinstance(node, ast.Constant):
            if isinstance(node.value, (int, float)):
                return node.value
            raise ValueError(f"Неподдерживаемый тип: {type(node.value)}")
        elif isinstance(node, ast.BinOp):
            left = self.eval_node(node.left)
            right = self.eval_node(node.right)
            op_type = type(node.op)
            if op_type not in self.OPERATORS:
                raise ValueError(f"Оператор не поддерживается")
            return self.OPERATORS[op_type](left, right)
        elif isinstance(node, ast.UnaryOp):
            operand = self.eval_node(node.operand)
            return self.OPERATORS[type(node.op)](operand)
        elif isinstance(node, ast.Call):
            if isinstance(node.func, ast.Name):
                fname = node.func.id
                if fname in self.FUNCTIONS:
                    args = [self.eval_node(a) for a in node.args]
                    return self.FUNCTIONS[fname](*args)
            raise ValueError(f"Функция не поддерживается")
        elif isinstance(node, ast.Name):
            if node.id in self.variables:
                return self.variables[node.id]
            raise ValueError(f"Неизвестная переменная: {node.id}")
        else:
            raise ValueError(f"Неподдерживаемая конструкция")
    
    def calculate(self, expr):
        try:
            tree = ast.parse(expr, mode='eval')
            result = self.eval_node(tree.body)
            self.history.append((expr, result))
            return result
        except Exception as e:
            return f"Ошибка: {e}"
    
    def show_history(self):
        for i, (expr, res) in enumerate(self.history, 1):
            print(f"{i}. {expr} = {res}")

    def generate_data(self, n=100, mean=50, std=15, outliers=5):

        random.seed(42)
        self.data = [random.gauss(mean, std) for _ in range(n)]
        # Добавляем аномалии
        for _ in range(outliers):
            self.data.append(random.choice([-1, 1]) * random.uniform(100, 150))
        self.metadata = {
            "generated": datetime.now().isoformat(),
            "count": len(self.data),
            "mean_param": mean,
            "std_param": std
        }
        return self
    
    def describe(self):
        """Описательные статистики"""
        if not self.data:
            return {}
        return {
            "count": len(self.data),
            "mean": statistics.mean(self.data),
            "median": statistics.median(self.data),
            "stdev": statistics.stdev(self.data),
            "min": min(self.data),
            "max": max(self.data),
            "range": max(self.data) - min(self.data)
        }
    
    def find_outliers(self, threshold=2.5):
        """Поиск аномалий по Z-score"""
        mean = statistics.mean(self.data)
        std = statistics.stdev(self.data)
        outliers = []
        for i, x in enumerate(self.data):
            z = abs(x - mean) / std if std > 0 else 0
            if z > threshold:
                outliers.append({"index": i, "value": x, "z_score": z})
        return outliers
    
    def histogram(self, bins=10):
        """Создание гистограммы"""
        min_val, max_val = min(self.data), max(self.data)
        bin_width = (max_val - min_val) / bins
        hist = [0] * bins
        for x in self.data:
            idx = min(int((x - min_val) / bin_width), bins - 1)
            hist[idx] += 1
        return {
            "bins": bins,
            "bin_width": bin_width,
            "min": min_val,
            "max": max_val,
            "counts": hist
        }
    
    def plot_histogram(self, width=50):
        """Текстовая визуализация"""
        hist = self.histogram()
        max_count = max(hist["counts"])
        print(f"\\n{'='*60}")

        print(f"{'='*60}")

            bar = "█" * bar_len
            start = hist["min"] + i * hist["bin_width"]
            end = start + hist["bin_width"]

async function runCode(editorId, consoleId){
  const editor = document.getElementById(editorId);
  const consoleEl = document.getElementById(consoleId);
  const code = editor.value;
  consoleEl.innerHTML = '<span class="info">▶ Выполнение...</span>\n';
  
  if(!pyodide){
    consoleEl.innerHTML = '<span class="err">Python ещё не загружен</span>';
    return;
  }
  
  // Перехват stdout/stderr
  pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
  
  try{
    await pyodide.runPythonAsync(code);
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    const stderr = pyodide.runPython('sys.stderr.getvalue()');
    
    let output = '';
    if(stdout) output += '<span class="out">'+escapeHtml(stdout)+'</span>';
    if(stderr) output += '<span class="err">'+escapeHtml(stderr)+'</span>';
    if(!stdout && !stderr) output = '<span class="info">(код выполнен без вывода)</span>';
    consoleEl.innerHTML = output;
  }catch(e){
    consoleEl.innerHTML = '<span class="err">'+escapeHtml(e.message)+'</span>';
  }
}

  // Запускаем код
  pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
  
  let stdout = '', stderr = '';
  try{
    await pyodide.runPythonAsync(code);
    stdout = pyodide.runPython('sys.stdout.getvalue()');
    stderr = pyodide.runPython('sys.stderr.getvalue()');
  }catch(e){
    stderr = e.message;
  }
  
  const output = stdout + stderr;
  let passed = 0;
  
  lesson.tests.forEach((test, i)=>{
    let ok = false;
    try{
      ok = test.check(output, code);
    }catch(e){ok = false}
    if(ok) passed++;
    
    const div = document.createElement('div');
    div.className = 'test-item ' + (ok?'pass':'fail');
    div.innerHTML = `<div class="test-icon">${ok?'✓':'✗'}</div><div>${escapeHtml(test.text)}</div>`;
    testsEl.appendChild(div);
  });
  
  const status = document.getElementById('test-status');
  if(passed === lesson.tests.length){
    status.innerHTML = `<span style="color:var(--success)">✓ Все тесты пройдены (${passed}/${lesson.tests.length})</span>`;
    markCompleted(lessonId);

    status.innerHTML = `<span style="color:var(--error)">Пройдено: ${passed}/${lesson.tests.length}</span>`;
  }
}

    localStorage.removeItem('pylearn_name');
    userName = '';
    showHome();
  }
}

// ================= СЕРТИФИКАТ =================
function showCertificate(){
  const all = getAllLessons();
  const done = all.filter(l=>progress[l.id]).length;
  if(done < all.length){
    alert(`Пройдите все уроки! Осталось: ${all.length - done}`);
    return;
  }
  if(!userName){
    userName = prompt('Введите ваше имя для сертификата:') || 'Студент PyLearn';
    localStorage.setItem('pylearn_name', userName);
  }
  document.getElementById('certName').textContent = userName;
  document.getElementById('certDate').textContent = `Выдан: ${new Date().toLocaleDateString('ru-RU', {year:'numeric',month:'long',day:'numeric'})}`;
  document.getElementById('certModal').classList.add('show');
}

function closeCert(){
  document.getElementById('certModal').classList.remove('show');
}

function escapeHtml(s){
