<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyLearn — Курс Python</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e14;--bg2:#0d1117;--bg3:#161b22;--bg4:#1c2128;
  --border:#30363d;--border2:#21262d;
  --text:#e6edf3;--text2:#7d8590;--text3:#484f58;
  --accent:#2f81f7;--accent-h:#1f6feb;--success:#3fb950;--warn:#d29922;--danger:#f85149;
  --pink:#f778ba;--purple:#a371f7;
  --side:300px;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;position:fixed;top:0;left:0;right:0;z-index:100;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;cursor:pointer}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px}
.progress-info{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.progress-bar{width:90px;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--success);width:0%;transition:width .4s}
.menu-btn{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer}
.app{display:flex;margin-top:52px;height:calc(100vh - 52px)}
.sidebar{width:var(--side);background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;transition:transform .25s}
.main{flex:1;overflow-y:auto}
.lesson{max-width:880px;margin:0 auto;padding:28px 36px 80px;width:100%}
.side-h{padding:16px 18px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3)}
.module{border-bottom:1px solid var(--border2)}
.mod-h{padding:11px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;transition:background .15s}
.mod-h:hover{background:var(--bg3)}
.mod-h .ch{font-size:11px;color:var(--text2);transition:transform .2s}
.module.open .ch{transform:rotate(90deg)}
.mod-n{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);background:rgba(47,129,247,.12);padding:2px 6px;border-radius:4px;margin-right:7px}
.lessons{display:none;background:var(--bg)}
.module.open .lessons{display:block}
.li{padding:9px 18px 9px 32px;cursor:pointer;font-size:13.5px;color:var(--text2);display:flex;align-items:center;gap:8px;border-left:2px solid transparent;transition:all .15s}
.li:hover{color:var(--text);background:var(--bg2)}
.li.active{color:var(--accent);border-left-color:var(--accent);background:rgba(47,129,247,.08)}
.ck{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.li.done .ck{background:var(--success);border-color:var(--success);color:#fff}
.li.done .ck::before{content:'✓'}
.crumb{font-size:12.5px;color:var(--text2);margin-bottom:12px}
.crumb .s{color:var(--text3);margin:0 6px}
.l-title{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;line-height:1.2}
.l-sub{font-size:14.5px;color:var(--text2);margin-bottom:24px}
.l-sec{margin-bottom:28px}
.l-sec h2{font-size:20px;font-weight:700;margin:0 0 12px;padding-top:22px;border-top:1px solid var(--border2)}
.l-sec h3{font-size:16px;font-weight:600;margin:16px 0 8px}
.l-sec p{margin:0 0 12px;color:#c9d1d9}
.l-sec ul{margin:0 0 12px 22px;color:#c9d1d9}
.l-sec li{margin-bottom:5px}
.l-sec code{font-family:'JetBrains Mono',monospace;background:var(--bg4);padding:2px 6px;border-radius:4px;font-size:12.5px;color:var(--pink);border:1px solid var(--border2)}
.l-sec strong{color:#fff;font-weight:600}
.note{background:rgba(47,129,247,.08);border-left:3px solid var(--accent);padding:12px 14px;border-radius:0 6px 6px 0;margin:12px 0}
.warn{background:rgba(210,153,34,.08);border-left:3px solid var(--warn);padding:12px 14px;border-radius:0 6px 6px 0;margin:12px 0}
.cb{background:#010409;border:1px solid var(--border);border-radius:8px;margin:12px 0;overflow:hidden}
.cb-h{background:var(--bg3);padding:7px 12px;font-size:11.5px;color:var(--text2);font-family:'JetBrains Mono',monospace;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cb pre{padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.55;color:#c9d1d9;overflow-x:auto;margin:0}
.run-i{background:var(--accent);color:#fff;border:none;padding:3px 9px;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit}
.run-i:hover{background:var(--accent-h)}
.ew{background:#010409;border:1px solid var(--border);border-radius:8px;margin:12px 0;overflow:hidden}
.ew-h{background:var(--bg3);padding:7px 12px;font-size:11.5px;color:var(--text2);font-family:'JetBrains Mono',monospace;border-bottom:1px solid var(--border)}
.ed{display:flex;height:240px;overflow:hidden}
.ln{padding:12px 8px 12px 12px;background:var(--bg2);color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.55;text-align:right;user-select:none;min-width:38px;overflow:hidden}
.ed textarea{flex:1;background:transparent;color:#e6edf3;border:none;outline:none;resize:none;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.55;tab-size:4;white-space:pre;overflow:auto}
.cw{background:#010409;border:1px solid var(--border);border-radius:8px;margin:12px 0;overflow:hidden}
.cw-h{background:var(--bg3);padding:7px 12px;font-size:11.5px;color:var(--text2);font-family:'JetBrains Mono',monospace;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.co{padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.55;color:#c9d1d9;min-height:60px;max-height:280px;overflow:auto;white-space:pre-wrap}
.co .err{color:var(--danger)}
.co .out{color:#c9d1d9}
.co .ok{color:var(--success)}
.co .ph{color:var(--text3);font-style:italic}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:var(--accent-h)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn2{background:var(--bg4);color:var(--text);border:1px solid var(--border)}
.btn2:hover{background:var(--bg3)}
.br{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.chl{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin:14px 0}
.chl-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.chl-b{background:rgba(210,153,34,.15);color:var(--warn);padding:3px 9px;border-radius:12px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.chl h3{margin:0;font-size:17px}
.chl-d{color:#c9d1d9;margin-bottom:12px;font-size:14px}
.chl-t{background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2)}
.chl-t .tt{color:var(--text);font-weight:600;margin-bottom:5px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.tr{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12.5px}
.tr .ic{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.tr.p .ic{background:var(--success);color:#fff}
.tr.p .ic::before{content:'✓'}
.tr.f .ic{background:var(--danger);color:#fff}
.tr.f .ic::before{content:'✕'}
.tr.p{color:var(--success)}
.tr.f{color:var(--danger)}
.td{color:var(--text3);font-size:11.5px;margin-left:22px;font-family:'JetBrains Mono',monospace}
.nav{display:flex;justify-content:space-between;margin-top:40px;padding-top:22px;border-top:1px solid var(--border);gap:12px}
.nb{background:var(--bg4);border:1px solid var(--border);color:var(--text);padding:11px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13.5px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:180px;transition:all .15s}
.nb:hover{border-color:var(--accent);background:var(--bg3)}
.nb.next{margin-left:auto;text-align:right}
.nb .lb{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.nb .tt{font-weight:600;color:var(--text)}
.loader{position:fixed;inset:0;background:rgba(10,14,20,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;gap:18px}
.loader.hide{display:none}
.spin{width:44px;height:44px;border:4px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lt{color:var(--text2);font-size:13.5px;text-align:center}
.lp{font-size:22px;font-weight:700;color:var(--accent)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg4);border:1px solid var(--border);border-left:3px solid var(--success);padding:12px 18px;border-radius:8px;color:var(--text);font-size:13.5px;z-index:1000;max-width:340px;transform:translateX(120%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{transform:translateX(0)}
.toast.err{border-left-color:var(--danger)}
.toast.info{border-left-color:var(--accent)}
@media(max-width:900px){:root{--side:260px}.sidebar{position:fixed;left:0;top:52px;height:calc(100vh - 52px);z-index:50;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.menu-btn{display:block}.lesson{padding:22px 16px 70px}.l-title{font-size:23px}}
.tok-kw{color:#ff7b72}.tok-str{color:#a5d6ff}.tok-num{color:#79c0ff}.tok-com{color:#8b949e;font-style:italic}.tok-fn{color:#d2a8ff}.tok-bi{color:#ffa657}
</style>
</head>
<body>
<div class="loader" id="loader">
  <div class="lp" id="lp">0%</div>
  <div class="spin"></div>
  <div class="lt" id="lt">Загрузка Python (Pyodide)...<br>Это займёт несколько секунд</div>
</div>
<div class="topbar">
  <button class="menu-btn" id="menuBtn">☰</button>
  <div class="logo" onclick="goHome()"><div class="logo-icon">Py</div><span>PyLearn</span></div>
  <div class="progress-info">
    <span id="pt">0 / 0</span>
    <div class="progress-bar"><div class="progress-fill" id="pf"></div></div>
  </div>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="lesson" id="lc"></div></main>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<script>
const CURRICULUM=[];let pyodide=null,currId=null;
let prog=JSON.parse(localStorage.getItem('pylearn_p')||'{}');

async function initPyodide(){
  const l=document.getElementById('loader'),p=document.getElementById('lp'),t=document.getElementById('lt');
  try{
    p.textContent='20%';t.innerHTML='Загрузка Python runtime...';
    pyodide=await loadPyodide();
    p.textContent='80%';t.innerHTML='Настройка окружения...';
    pyodide.setStdout({batched:s=>appC(s,'out')});
    pyodide.setStderr({batched:s=>appC(s,'err')});
    await pyodide.loadPackage(['micropip']);
    p.textContent='100%';
    setTimeout(()=>l.classList.add('hide'),300);
  }catch(e){
    t.innerHTML='<span style="color:#f85149">Ошибка загрузки Python.</span><br>Проверьте интернет.<br><br><button class="btn" onclick="location.reload()">Повторить</button>';
    console.error(e);
  }
}
function appC(t,type='out'){
  const c=document.getElementById('co');if(!c)return;
  const ph=c.querySelector('.ph');if(ph)ph.remove();
  const s=document.createElement('span');s.className=type;s.textContent=t;
  c.appendChild(s);c.scrollTop=c.scrollHeight;
}
function showToast(m,t='success'){const e=document.getElementById('toast');e.textContent=m;e.className='toast '+t;setTimeout(()=>e.classList.add('show'),50);setTimeout(()=>e.classList.remove('show'),2800)}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function getAll(){const a=[];CURRICULUM.forEach(m=>m.lessons.forEach(l=>a.push(l)));return a}
function findLesson(id){for(const m of CURRICULUM)for(const l of m.lessons)if(l.id===id)return l;return null}
function findIdx(id){const a=getAll();for(let i=0;i<a.length;i++)if(a[i].id===id)return i;return -1}

function highlightPython(c){
  const kw=['def','class','if','elif','else','for','while','return','import','from','as','try','except','finally','with','lambda','yield','pass','break','continue','raise','in','not','and','or','is','None','True','False','global','nonlocal','del','assert','async','await'];
  const bi=['print','len','range','input','int','float','str','list','dict','tuple','set','bool','type','isinstance','enumerate','zip','map','filter','sorted','sum','min','max','abs','round','open','any','all','iter','next','reversed'];
  c=c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  c=c.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,m=>`§S§${m}§E§`);
  c=c.replace(/(#[^\n]*)/g,m=>`§C§${m}§E§`);
  c=c.replace(new RegExp('\\b('+kw.join('|')+')\\b','g'),'<span class="tok-kw">$1</span>');
  c=c.replace(new RegExp('\\b('+bi.join('|')+')\\b(?=\\()','g'),'<span class="tok-bi">$1</span>');
  c=c.replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
  c=c.replace(/\b([a-zA-Z_]\w*)(?=\()/g,'<span class="tok-fn">$1</span>');
  c=c.replace(/§S§([\s\S]*?)§E§/g,'<span class="tok-str">$1</span>');
  c=c.replace(/§C§([\s\S]*?)§E§/g,'<span class="tok-com">$1</span>');
  return c;
}

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  let h='<div class="side-h">Учебная программа</div>';
  CURRICULUM.forEach((m,mi)=>{
    const ex=m.expanded?'open':'';
    h+=`<div class="module ${ex}" data-m="${mi}"><div class="mod-h" onclick="toggleMod(${mi})"><span><span class="mod-n">${mi+1}</span>${m.title}</span><span class="ch">▶</span></div><div class="lessons">`;
    m.lessons.forEach(l=>{
      const d=(prog[l.id]&&prog[l.id].done)?'done':'';
      h+=`<div class="li ${d}" data-l="${l.id}" onclick="loadLesson('${l.id}')"><span class="ck"></span><span>${l.title}</span></div>`;
    });
    h+='</div></div>';
  });
  sb.innerHTML=h;
}
function toggleMod(i){document.querySelector(`[data-m="${i}"]`).classList.toggle('open')}
function updateProgress(){
  const a=getAll();
  const c=a.filter(l=>prog[l.id]&&prog[l.id].done).length;
  document.getElementById('pt').textContent=`${c} / ${a.length}`;
  document.getElementById('pf').style.width=(a.length?(c/a.length*100):0)+'%';
}
function updateSidebarLesson(id){
  const e=document.querySelector(`[data-l="${id}"]`);
  if(!e)return;
  if(prog[id]&&prog[id].done)e.classList.add('done');else e.classList.remove('done');
}
function markPassed(id,ci){
  if(!prog[id])prog[id]={c:{}};
  if(!prog[id].c)prog[id].c={};
  prog[id].c[ci]=true;
  const l=findLesson(id);
  if(l&&l.challenges&&l.challenges.length>0){
    if(l.challenges.every((_,i)=>prog[id].c[i])){prog[id].done=true;updateSidebarLesson(id)}
  }else if(l){prog[id].done=true;updateSidebarLesson(id)}
  localStorage.setItem('pylearn_p',JSON.stringify(prog));updateProgress();
}
function markVisited(id){
  if(!prog[id])prog[id]={c:{}};
  const l=findLesson(id);
  if(l&&(!l.challenges||l.challenges.length===0)){prog[id].done=true;updateSidebarLesson(id)}
  localStorage.setItem('pylearn_p',JSON.stringify(prog));updateProgress();
}

function setupEditor(eid,lid){
  const ta=document.getElementById(eid);if(!ta)return;
  const ln=document.getElementById(lid);
  function upd(){const n=ta.value.split('\n').length;let s='';for(let i=1;i<=n;i++)s+=i+'\n';ln.textContent=s}
  ta.addEventListener('input',upd);
  ta.addEventListener('scroll',()=>{ln.scrollTop=ta.scrollTop});
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart,en=ta.selectionEnd;ta.value=ta.value.substring(0,s)+'    '+ta.value.substring(en);ta.selectionStart=ta.selectionEnd=s+4;upd()}
    if(e.key==='Enter'&&ta.selectionStart===ta.selectionEnd){
      const s=ta.selectionStart;const line=ta.value.substring(0,s).split('\n').pop();
      const ind=(line.match(/^ */)||[''])[0];const ex=/[:({[]\s*$/.test(line)?'    ':'';
      if(ind||ex){e.preventDefault();const ins=ind+ex;ta.value=ta.value.substring(0,s)+'\n'+ins+ta.value.substring(s);ta.selectionStart=ta.selectionEnd=s+1+ins.length;upd()}
    }
  });
  upd();
}

function loadLesson(id){
  const l=findLesson(id);if(!l)return;currId=id;
  markVisited(id);
  document.querySelectorAll('.li').forEach(e=>e.classList.toggle('active',e.dataset.l===id));
  CURRICULUM.forEach((m,mi)=>{if(m.lessons.some(x=>x.id===id))document.querySelector(`[data-m="${mi}"]`).classList.add('open')});
  const idx=findIdx(id);const all=getAll();
  const prev=idx>0?all[idx-1]:null;const next=idx<all.length-1?all[idx+1]:null;
  let mt='';CURRICULUM.forEach(m=>{if(m.lessons.some(x=>x.id===id))mt=m.title});
  let h=`<div class="crumb"><span>${mt}</span><span class="s">/</span><span>${l.title}</span></div><h1 class="l-title">${l.title}</h1><p class="l-sub">${l.subtitle||''}</p>`;
  l.content.forEach(b=>{
    if(b.t==='h2')h+=`<h2>${b.x}</h2>`;
    else if(b.t==='h3')h+=`<h3>${b.x}</h3>`;
    else if(b.t==='p')h+=`<p>${b.x}</p>`;
    else if(b.t==='ul')h+=`<ul>${b.i.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    else if(b.t==='note')h+=`<div class="note">${b.x}</div>`;
    else if(b.t==='warn')h+=`<div class="warn">${b.x}</div>`;
    else if(b.t==='code'){
      const cid='c'+Math.random().toString(36).slice(2,9);
      h+=`<div class="cb"><div class="cb-h"><span>${b.title||'Python'}</span>${b.run?`<button class="run-i" onclick="runExample('${cid}')">▶ Запустить</button>`:''}</div><pre id="${cid}" data-code="${encodeURIComponent(b.code)}">${highlightPython(b.code)}</pre></div>`;
    }
  });
  if(l.challenges&&l.challenges.length){
    l.challenges.forEach((c,ci)=>{
      const eid=`ed-${id}-${ci}`,cid=`co-${id}-${ci}`,tid=`ts-${id}-${ci}`,lid=`ln-${id}-${ci}`;
      h+=`<div class="chl"><div class="chl-h"><span class="chl-b">Задание ${ci+1}</span><h3>${c.title}</h3></div><div class="chl-d">${c.desc}</div>
<div class="ew"><div class="ew-h">script.py</div><div class="ed"><div class="ln" id="${lid}">1</div><textarea id="${eid}" spellcheck="false">${escapeHtml(c.init)}</textarea></div></div>
<div class="br"><button class="btn" onclick="runChallenge('${id}',${ci})">▶ Запустить и проверить</button><button class="btn2 btn" onclick="resetEd('${id}',${ci})">Сбросить</button>${c.sol?`<button class="btn2 btn" onclick="showSol('${id}',${ci})">Решение</button>`:''}</div>
<div class="cw"><div class="cw-h"><span>Консоль</span><button class="run-i" style="background:var(--bg4)" onclick="clr('${cid}')">Очистить</button></div><div class="co" id="${cid}"><span class="ph">>>> Вывод появится здесь</span></div></div>
<div class="chl-t" id="${tid}"></div></div>`;
    });
  }
  h+=`<div class="nav">${prev?`<button class="nb" onclick="loadLesson('${prev.id}')"><span class="lb">← Предыдущий</span><span class="tt">${prev.title}</span></button>`:'<div></div>'}${next?`<button class="nb next" onclick="loadLesson('${next.id}')"><span class="lb">Следующий →</span><span class="tt">${next.title}</span></button>`:''}</div>`;

function runExample(cid){
  if(!pyodide){showToast('Python ещё загружается...','err');return}
  const el=document.getElementById(cid);if(!el)return;
  const code=decodeURIComponent(el.dataset.code);
  let w=document.getElementById('co-'+cid);if(w)w.remove();
  w=document.createElement('div');w.className='cw';w.id='co-'+cid;
  w.innerHTML=`<div class="cw-h"><span>Вывод</span><button class="run-i" style="background:var(--bg4)" onclick="this.closest('.cw').remove()">Закрыть</button></div><div class="co"><span class="ph">>>> Выполняется...</span></div>`;
  el.parentElement.parentElement.insertBefore(w,el.parentElement.nextSibling);
  const out=w.querySelector('.co');
  function res(){pyodide.setStdout({batched:s=>appC(s,'out')});pyodide.setStderr({batched:s=>appC(s,'err')})}
  pyodide.setStdout({batched:s=>{out.querySelector('.ph')?.remove();const sp=document.createElement('span');sp.className='out';sp.textContent=s;out.appendChild(sp);out.scrollTop=out.scrollHeight}});
  pyodide.setStderr({batched:s=>{out.querySelector('.ph')?.remove();const sp=document.createElement('span');sp.className='err';sp.textContent=s;out.appendChild(sp);out.scrollTop=out.scrollHeight}});
  pyodide.runPythonAsync(code).then(()=>{res();if(!out.querySelector('span:not(.ph)')){const p=document.createElement('span');p.className='ph';p.textContent='>>> (нет вывода)';out.appendChild(p)}}).catch(e=>{res();out.querySelector('.ph')?.remove();const sp=document.createElement('span');sp.className='err';sp.textContent=e.message||String(e);out.appendChild(sp)});
}

async function runChallenge(id,ci){
  if(!pyodide){showToast('Python ещё загружается...','err');return}
  const l=findLesson(id);const c=l.challenges[ci];
  const code=document.getElementById(`ed-${id}-${ci}`).value;
  const cEl=document.getElementById(`co-${id}-${ci}`),tEl=document.getElementById(`ts-${id}-${ci}`);
  cEl.innerHTML='<span class="ph">>>> Выполняется...</span>';
  tEl.innerHTML='<div class="tt">Выполняется...</div>';
  try{pyodide.FS.writeFile('/tmp/u.py',code)}catch(e){
    const esc=code.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n');
    try{await pyodide.runPythonAsync(`open('/tmp/u.py','w').write("${esc}")`)}catch(e2){cEl.innerHTML=`<span class="err">Не удалось записать код: ${e.message||e}</span>`;return}
  }
  let uo='';pyodide.setStdout({batched:s=>{uo+=s}});pyodide.setStderr({batched:s=>{uo+=s}});
  try{await pyodide.runPythonAsync(`exec(open('/tmp/u.py').read())`)}catch(e){uo+='\n'+(e.message||e)}
  pyodide.setStdout({batched:s=>appC(s,'out')});pyodide.setStderr({batched:s=>appC(s,'err')});
  let allP=true,rh='<div class="tt">Результаты тестов:</div>';
  for(let i=0;i<c.tests.length;i++){
    const t=c.tests[i];let p=false,det='';
    const ind=t.code.split('\n').map(l=>'    '+l).join('\n');
    const py=`_TP=False;_TD=''
try:
${ind}
    _TP=True
except AssertionError as _ae:
    _TP=False;_TD='AssertionError: '+str(_ae)
except Exception as _e:
    _TP=False;_TD=type(_e).__name__+': '+str(_e)`;
    try{
      await pyodide.runPythonAsync(py);
      let tp=pyodide.globals.get('_TP'),td=pyodide.globals.get('_TD');
      if(tp&&typeof tp.toJs==='function')tp=tp.toJs();
      if(td&&typeof td.toJs==='function')td=td.toJs();
      p=!!tp;det=td||'';
    }catch(e){det=(e.message||e).slice(0,300);p=false}
    if(!p)allP=false;
    rh+=`<div class="tr ${p?'p':'f'}"><span class="ic"></span><span>${t.name}${p?' — пройден':' — не пройден'}</span></div>${det&&!p?`<div class="td">${escapeHtml(det)}</div>`:''}`;
  }
  tEl.innerHTML=rh;
  cEl.innerHTML='';
  if(uo.trim()){const o=document.createElement('span');o.className='out';o.textContent=uo;cEl.appendChild(o)}else{const p=document.createElement('span');p.className='ph';p.textContent='>>> (нет вывода)';cEl.appendChild(p)}
  if(allP){markPassed(id,ci);showToast(`✓ Задание выполнено: ${c.title}`);const s=document.createElement('div');s.className='ok';s.style.marginTop='6px';s.textContent='>>> Все тесты пройдены!';cEl.appendChild(s)}
}
